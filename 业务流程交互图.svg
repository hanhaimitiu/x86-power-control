<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 780" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <style>
    .panel{fill:#ffffff;stroke:#d8d2c7;stroke-width:1.5;}
    .phead{fill:#ece7df;stroke:#d8d2c7;stroke-width:1.5;}
    .ptitle{fill:#2d2a27;font-size:15px;font-weight:700;}
    .box{fill:#ffffff;stroke:#3f6b78;stroke-width:1.5;rx:6;}
    .bbox{fill:#e3ecee;stroke:#3f6b78;stroke-width:1.5;rx:6;}
    .bmain{fill:#2d2a27;font-size:13px;font-weight:600;}
    .bsub{fill:#5c5650;font-size:11px;}
    .arrow{stroke:#3f6b78;stroke-width:1.8;fill:none;}
    .acc{fill:#3f6b78;font-size:12.5px;font-weight:700;}
    .note{fill:#a86a4c;font-size:11.5px;}
    .st{fill:#f4f1ea;stroke:#c9c2b6;stroke-width:1.2;rx:6;}
    .stl{fill:#5c5650;font-size:10.5px;}
    .stlh{fill:#2d2a27;font-size:11px;font-weight:700;}
    .ttl{fill:#2d2a27;font-size:17px;font-weight:700;}
    .role{fill:#5c5650;font-size:12px;}
  </style>

  <text x="380" y="30" text-anchor="middle" class="ttl">x86-power-control</text>
  <text x="380" y="50" text-anchor="middle" class="role">硬件执行层 · 真正去拉电源键/断电/复位的 x86 落地逻辑（单文件大状态机）</text>

  <!-- Panel A 业务流程 -->
  <rect class="panel" x="20" y="64" width="720" height="312" rx="6"/>
  <rect class="phead" x="20" y="64" width="720" height="32" rx="6"/>
  <text x="34" y="86" class="ptitle">一、业务流程：短按电源键软开机</text>

  <rect class="box" x="90" y="104" width="580" height="40" rx="6"/>
  <text x="110" y="124" class="bmain">收到 transition / Web / IPMI 开机请求</text>
  <text x="110" y="139" class="bsub">或 state-manager 拉起 Power@&lt;N&gt;.service</text>

  <line class="arrow" x1="380" y1="144" x2="380" y2="158"/>
  <polygon points="372,156 388,156 380,168" fill="#3f6b78"/>

  <rect class="box" x="90" y="168" width="580" height="46" rx="6"/>
  <text x="110" y="188" class="bmain">sendPowerControlEvent(PowerOn)  power_control.cpp:467</text>
  <text x="110" y="205" class="bsub">当前状态 + 事件 → getPowerStateHandler 决定下一步</text>

  <line class="arrow" x1="380" y1="214" x2="380" y2="228"/>
  <polygon points="372,226 388,226 380,238" fill="#3f6b78"/>

  <rect class="box" x="90" y="238" width="580" height="46" rx="6"/>
  <text x="110" y="258" class="bmain">powerOn()：按 power-config-host0.json 拉 SIO_ONCTL / PWRBTN 脉冲</text>
  <text x="110" y="275" class="bsub">setGPIOOutput / assertGPIOForMs（libgpiod 线名来自 JSON）</text>

  <line class="arrow" x1="380" y1="284" x2="380" y2="298"/>
  <polygon points="372,296 388,296 380,308" fill="#3f6b78"/>

  <rect class="box" x="90" y="308" width="580" height="46" rx="6"/>
  <text x="110" y="328" class="bmain">等 POWER_OK / SIO_POWER_GOOD 上升沿（GPIO 事件回调）</text>
  <text x="110" y="345" class="bsub">起看门狗 powerOKWatchdogTimerStart：超时没 good → 报 VR 失败</text>

  <line class="arrow" x1="380" y1="354" x2="380" y2="368"/>
  <polygon points="372,366 388,366 380,378" fill="#3f6b78"/>

  <rect class="bbox" x="90" y="378" width="580" height="44" rx="6"/>
  <text x="110" y="398" class="bmain">状态迁移 → 更新 State.Chassis.CurrentPowerState</text>
  <text x="110" y="414" class="bsub">currentHostStateMonitor 反向对账 state-manager 自家状态机</text>

  <text x="700" y="200" text-anchor="end" class="note">失败统一用 sd_journal_send</text>
  <text x="700" y="216" text-anchor="end" class="note">打 Redfish 消息（如</text>
  <text x="700" y="232" text-anchor="end" class="note">SystemPowerGoodFailed）</text>
  <text x="700" y="248" text-anchor="end" class="note">→ 日志触发告警的标准模式</text>

  <!-- Panel B 体系结构 -->
  <rect class="panel" x="20" y="388" width="720" height="200" rx="6"/>
  <rect class="phead" x="20" y="388" width="720" height="32" rx="6"/>
  <text x="34" y="410" class="ptitle">二、代码体系结构：单文件状态机 + 信号抽象</text>

  <rect class="st" x="60" y="430" width="320" height="140" rx="6"/>
  <text x="74" y="450" class="stlh">10 个 PowerState（getPowerStateHandler:438）</text>
  <text x="74" y="470" class="stl">on / waitForPowerOK / waitForSIOPowerGood</text>
  <text x="74" y="486" class="stl">off / transitionToOff</text>
  <text x="74" y="502" class="stl">gracefulTransitionToOff（软超时→硬）</text>
  <text x="74" y="518" class="stl">cycleOff / transitionToCycleOff</text>
  <text x="74" y="534" class="stl">gracefulTransitionToCycleOff</text>
  <text x="74" y="550" class="stl">checkForWarmReset</text>

  <text x="416" y="446" class="stlh">关键机制：</text>
  <text x="416" y="468" class="stl">· 信号抽象：config JSON 把每路信号</text>
  <text x="416" y="484" class="stl">  声明为 GPIO 或 DBUS 两种源</text>
  <text x="416" y="500" class="stl">· 平台适配 = bbappend 换 JSON，不改 C++</text>
  <text x="416" y="520" class="stl">· setPowerState/savePowerState 持久化</text>
  <text x="416" y="536" class="stl">· RestartCause / Settings 读取</text>
  <text x="416" y="556" class="stl">· parseEventConfig:2393 解析 JSON</text>
  <text x="416" y="576" class="stl">· 单测极少，靠整机联调</text>

  <!-- Panel C 交互 -->
  <rect class="panel" x="20" y="600" width="720" height="150" rx="6"/>
  <rect class="phead" x="20" y="600" width="720" height="32" rx="6"/>
  <text x="34" y="622" class="ptitle">三、对外 D-Bus 交互</text>

  <text x="40" y="650" class="acc">消费（读）：</text>
  <text x="40" y="670" class="stl">· state-manager 的 State.Host.HostState（判断主机是否在运行）</text>
  <text x="40" y="688" class="stl">· Settings（PowerRestorePolicy 等）</text>

  <text x="40" y="712" class="acc">上报（写）：</text>
  <text x="40" y="732" class="stl">· State.Chassis.CurrentPowerState ｜ State.Host.RestartCause ｜ Chassis.Buttons（电源键状态）｜ OperatingSystem.Status</text>
</svg>
